<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Booking Room</title>

    <link rel="stylesheet"
    href="../../css/style.css">

</head>

<body>

<section class="booking-page">

    <div class="booking-title">

        <p>LUXURY BOOKING</p>

        <h1>Reserve Your Dream Room</h1>

        <span>
            Experience premium comfort and luxury facilities
            only at LuxStay Hotel.
        </span>

    </div>


    <div class="booking-form">

        <label>Choose Room</label>

        <select id="room">

            <option value="">
                Select Room
            </option>

            <option value="1283250">
                Deluxe Room
            </option>

            <option value="2150000">
                Premier Room
            </option>

            <option value="3850000">
                President Suite
            </option>

            <option value="4950000">
                Royal Suite
            </option>

        </select>


        <label>Check In</label>
        <input type="date" id="checkIn">


        <label>Check Out</label>
        <input type="date" id="checkOut">


        <label>Adults</label>

        <input
        type="number"
        id="adult"
        value="1"
        min="1">


        <label>Children</label>

        <input
        type="number"
        id="children"
        value="0"
        min="0">


        <div class="check-group">

            <label>
                Extra Bed (+300000)
            </label>

            <input
            type="checkbox"
            id="extraBed">

        </div>


        <div class="check-group">

            <label>
                Breakfast (+150000)
            </label>

            <input
            type="checkbox"
            id="breakfast">

        </div>


        <div class="check-group">

            <label>
                Spa (+500000)
            </label>

            <input
            type="checkbox"
            id="spa">

        </div>


        <div class="check-group">

            <label>
                Honeymoon Package (+1000000)
            </label>

            <input
            type="checkbox"
            id="honeymoon">

        </div>


        <div class="check-group">

            <label>
                Anniversary Setup (+750000)
            </label>

            <input
            type="checkbox"
            id="anniversary">

        </div>


        <div class="check-group">

            <label>
                Kids Playground (+250000)
            </label>

            <input
            type="checkbox"
            id="kids">

        </div>


        <label>Room View</label>

        <select id="view">

            <option value="0">
                City View
            </option>

            <option value="500000">
                Ocean View (+500000)
            </option>

        </select>


        <label>Promo Code</label>

        <input
        type="text"
        id="promo"
        placeholder="Enter Promo Code">


        <label>Payment Method</label>

        <select id="paymentMethod">

            <option>Bank Transfer</option>

            <option>Credit Card</option>

            <option>Debit Card</option>

            <option>QRIS</option>

            <option>OVO</option>

            <option>DANA</option>

            <option>GoPay</option>

            <option>ShopeePay</option>

            <option>PayPal</option>

        </select>


        <p id="dateInfo"></p>
        
        <p id="capacityInfo"></p>

        <p id="stockInfo"></p>

        <h2 id="total">
            Total : 0 IDR
        </h2>


        <button
        id="confirmBookingBtn"
        type="button"
        onclick="saveBooking()">

            Confirm Booking

        </button>

    </div>

</section>


<script src="../../js/booking.js"></script>

</body>
</html>
